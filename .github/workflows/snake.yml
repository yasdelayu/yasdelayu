name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yasdelayu
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#0F1117,#BD00FF,#FF6B9D,#39FF14,#00F0FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#BD00FF&color_dots=#0F1117,#00F0FF,#FF6B9D,#39FF14,#BD00FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
